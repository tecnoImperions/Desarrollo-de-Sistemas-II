<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SITEL — Sistema de Trazabilidad Logística</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SITEL.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A;">
            <div style="text-align: center;">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <h4 style="font-weight: 800; margin-bottom: 0.35rem; color: #0F172A;">Cargando SITEL Logistics...</h4>
                <p style="color: #64748B; font-size: 0.9rem; margin: 0;">Sincronizando módulos de Inventarios, Clientes y Despachos</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado en la interfaz.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
